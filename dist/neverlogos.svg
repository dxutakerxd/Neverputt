<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- MiniPutt Mobile Logo -->
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620">
  <!-- Green background -->
  <rect width="620" height="620" fill="#32A62B"/>

  <!-- Golf hole (dark ellipse) -->
  <ellipse cx="330" cy="340" rx="95" ry="38" fill="#1a3a18"/>
  <ellipse cx="330" cy="336" rx="90" ry="35" fill="#2d5a2a"/>

  <!-- Flag pole -->
  <line x1="310" y1="180" x2="310" y2="340" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Flag (red triangle) -->
  <polygon points="314,180 380,210 314,235" fill="#E53935"/>

  <!-- Golf ball (white circle with subtle shadow) -->
  <circle cx="270" cy="370" r="45" fill="#f0f0f0"/>
  <circle cx="270" cy="370" r="45" fill="#ffffff"/>
  <circle cx="258" cy="358" r="8" fill="rgba(255,255,255,0.6)"/>

  <!-- Small sparkle bottom-right -->
  <g transform="translate(530, 540)" fill="#ffffff" opacity="0.7">
    <path d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z"/>
  </g>
  <g transform="translate(548, 558)" fill="#ffffff" opacity="0.4">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z"/>
  </g>
</svg>
